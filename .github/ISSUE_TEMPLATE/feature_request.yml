name: Feature request
description: Suggest a focused improvement
title: ""
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the behavior you would expect to see.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Accuracy, data, or compatibility limits
      description: Note any important boundaries the change should preserve.
